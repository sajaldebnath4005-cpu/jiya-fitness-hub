<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - AI-Fitness Trainer</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/progress.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="container stack">
      <div id="loading" class="loading">Loading your profile...</div>

      <div id="content" class="hidden stack">
        <div class="card profile-top">
          <div class="avatar" id="avatar">J</div>
          <div style="flex: 1">
            <h1 style="margin: 0" id="nameText">Athlete</h1>
            <p class="small muted" style="margin: 4px 0 0" id="usernameText"></p>
            <div class="row wrap" style="margin-top: 8px">
              <span class="pill pill-primary" id="levelPill">Level 1</span>
              <span class="pill" id="xpPill">0 XP</span>
              <span class="pill" id="streakPill">🔥 0 days</span>
            </div>
          </div>
        </div>

        <div class="card stack">
          <h2>My details</h2>
          <label for="nameInput">Name</label>
          <input id="nameInput" type="text" />
          <div class="info-line"><span>Email</span><span id="emailText"></span></div>
          <div class="info-line"><span>Username</span><span id="handleText"></span></div>
          <button class="btn btn-primary btn-block" id="saveNameButton">Save name</button>
        </div>

        <div class="card stack">
          <h2>Fitness info</h2>
          <label for="goalSelect">Goal</label>
          <select id="goalSelect"></select>
          <div class="grid grid-2">
            <div>
              <label for="weightInput">Current weight (kg)</label>
              <input id="weightInput" type="number" step="0.1" />
            </div>
            <div>
              <label for="targetInput">Target weight (kg)</label>
              <input id="targetInput" type="number" step="0.1" />
            </div>
          </div>
          <label for="levelSelect">Fitness level</label>
          <select id="levelSelect">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
          <label for="locationSelect">Workout location</label>
          <select id="locationSelect">
            <option value="Home">Home</option>
            <option value="Gym">Gym</option>
            <option value="Both">Both</option>
          </select>
          <button class="btn btn-primary btn-block" id="saveFitnessButton">Save &amp; update my plan</button>
          <p class="small muted">
            Changing your goal builds a new workout plan and new calorie targets.
          </p>
        </div>

        <div class="card stack">
          <h2>My numbers</h2>
          <div class="info-line"><span>Daily calories</span><span id="calText"></span></div>
          <div class="info-line"><span>Protein / carbs / fat</span><span id="macroText"></span></div>
          <div class="info-line"><span>Workouts completed</span><span id="workoutText"></span></div>
          <div class="info-line"><span>Friends</span><span id="friendText"></span></div>
        </div>

        <div class="card stack">
          <h2>Achievements</h2>
          <div class="grid grid-4" id="badgeGrid"></div>
        </div>

        <div class="card stack">
          <h2>Account</h2>
          <a class="btn btn-outline btn-block" href="reset-password.html">Change password</a>
          <button class="btn btn-ghost btn-block" id="logoutButton">Log out</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/profile.js"></script>
  </body>
</html>
