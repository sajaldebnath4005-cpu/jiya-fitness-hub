<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard - AI-Fitness Trainer</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/social.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="container stack">
      <div>
        <h1>Leaderboard</h1>
        <p class="muted small">Ranked by XP. Only public info is shown.</p>
      </div>

      <div class="tabs">
        <button class="tab active" data-view="friends">Friends</button>
        <button class="tab" data-view="global">Everyone</button>
      </div>

      <div class="card" id="boardList"></div>
    </div>

    <script type="module" src="js/leaderboard.js"></script>
  </body>
</html>
