<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep - AI-Fitness Trainer</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/progress.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="container stack">
      <div>
        <h1>Sleep</h1>
        <p class="muted small">Log how long you slept. Recovery is part of training.</p>
      </div>

      <div class="card tracker-hero stack">
        <p class="stat-label">Sleep last night</p>
        <p class="big-number" id="sleepValue">- h</p>
        <div class="progress"><div class="progress-bar" id="sleepBar" style="width: 0%"></div></div>
        <p class="small muted" id="sleepNote">Goal: 8 hours</p>
      </div>

      <div class="card stack">
        <h2>Log sleep</h2>
        <label for="hoursInput">Hours slept</label>
        <input id="hoursInput" type="number" min="0" max="16" step="0.5" value="8" />
        <label for="qualitySelect">How did you feel?</label>
        <select id="qualitySelect">
          <option value="Great">Great</option>
          <option value="Good" selected>Good</option>
          <option value="Okay">Okay</option>
          <option value="Poor">Poor</option>
        </select>
        <button class="btn btn-primary btn-block" id="saveButton">Save sleep</button>
      </div>

      <div class="card stack">
        <h2>Last 7 nights</h2>
        <div class="chart" id="sleepChart"></div>
        <p class="small muted" id="averageText"></p>
      </div>

      <div class="card stack">
        <h2>History</h2>
        <div id="historyList"></div>
      </div>
    </div>

    <script type="module" src="js/sleep.js"></script>
  </body>
</html>
