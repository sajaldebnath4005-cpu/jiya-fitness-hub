<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water - Jiya Fit Buddy</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/progress.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="container stack">
      <div>
        <h1>Water</h1>
        <p class="muted small">Add every glass you drink. Your goal is 2500 ml a day.</p>
      </div>

      <div class="card tracker-hero stack">
        <p class="stat-label">Water today</p>
        <p class="big-number" id="waterValue">0 ml</p>
        <div class="progress"><div class="progress-bar" id="waterBar" style="width: 0%"></div></div>
        <p class="small muted" id="leftText"></p>
        <div class="quick-add" style="justify-content: center">
          <button class="btn btn-primary" data-ml="250">+250 ml</button>
          <button class="btn btn-outline" data-ml="500">+500 ml</button>
          <button class="btn btn-outline" data-ml="750">+750 ml</button>
          <button class="btn btn-ghost" id="undoButton">Undo last</button>
        </div>
      </div>

      <div class="card stack">
        <h2>Last 7 days</h2>
        <div class="chart" id="waterChart"></div>
      </div>

      <div class="card stack">
        <h2>Today's glasses</h2>
        <div id="todayList"></div>
      </div>
    </div>

    <script type="module" src="js/water.js"></script>
  </body>
</html>
