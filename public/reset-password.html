<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password - AI-Fitness Trainer</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img class="auth-brand-logo" src="/__l5e/assets-v1/184cc5b0-bf72-4a4b-8767-e92928db6b58/ai-fitness-trainer-logo.jpeg" alt="AI-Fitness Trainer" />
      </div>
      <h2 class="auth-title">Set a new password</h2>
      <p class="auth-sub">Type the new password you want to use</p>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" required minlength="6" />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Save new password</button>
      </form>

      <div id="message" class="auth-message hidden"></div>

      <p class="auth-footer"><a href="login.html">Back to log in</a></p>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
