<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - AI-Fitness Trainer</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img class="auth-brand-logo" src="/__l5e/assets-v1/184cc5b0-bf72-4a4b-8767-e92928db6b58/ai-fitness-trainer-logo.jpeg" alt="AI-Fitness Trainer" />
      </div>
      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-sub">Log in to continue your plan</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Your password" />
        </div>
        <button class="btn btn-primary btn-block" id="loginButton" type="submit">Log in</button>
      </form>

      <div id="message" class="auth-message hidden"></div>

      <p class="auth-footer">
        <a href="#" id="forgotLink">Forgot your password?</a>
      </p>
      <p class="auth-footer">
        New here? <a href="signup.html">Create an account</a>
      </p>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
