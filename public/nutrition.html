<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutrition - AI-Fitness Trainer</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/workout.css" />
    <link rel="stylesheet" href="css/progress.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="container stack">
      <div>
        <h1>Nutrition</h1>
        <p class="muted small">
          Your daily calorie and macro targets.
        </p>
      </div>

      <div class="grid grid-4">
        <div class="card metric-card">
          <span class="stat-label">Daily calories</span>
          <span class="stat-value" id="targetCalories">-</span>
          <span class="small muted" id="bmrText"></span>
        </div>
        <div class="card metric-card">
          <span class="stat-label">Protein</span><span class="stat-value" id="proteinValue">-</span>
        </div>
        <div class="card metric-card">
          <span class="stat-label">Carbs</span><span class="stat-value" id="carbsValue">-</span>
        </div>
        <div class="card metric-card">
          <span class="stat-label">Fat</span><span class="stat-value" id="fatValue">-</span>
        </div>
      </div>

    </div>

    <script type="module" src="js/nutrition.js"></script>
  </body>
</html>
